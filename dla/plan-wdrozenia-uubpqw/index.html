<script>
(function () {
  var f = document.getElementById("f"), h = document.getElementById("h"), o = document.getElementById("o"), b = document.getElementById("b");
  var d = JSON.parse(document.getElementById("dane").textContent);
  function bajty(s) { var x = atob(s), u = new Uint8Array(x.length); for (var i = 0; i < x.length; i++) u[i] = x.charCodeAt(i); return u; }
  if (!window.crypto || !crypto.subtle) {
    b.textContent = "Ta przeglądarka nie otworzy strony. Spróbuj w Chrome, Edge, Firefoksie albo Safari.";
    o.disabled = true;
    return;
  }
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var haslo = h.value.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!haslo) return;
    o.disabled = true; o.textContent = "Otwieram…"; b.textContent = "";
    crypto.subtle.importKey("raw", new TextEncoder().encode(haslo), "PBKDF2", false, ["deriveKey"])
      .then(function (k) { return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bajty(d.s), iterations: d.it, hash: "SHA-256" }, k, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); })
      .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: bajty(d.iv) }, k, bajty(d.c)); })
      .then(function (p) { var t = new TextDecoder().decode(p); document.open(); document.write(t); document.close(); })
      .catch(function () { o.disabled = false; o.textContent = "Otwórz"; b.textContent = "Hasło się nie zgadza."; h.select(); });
  });
})();
